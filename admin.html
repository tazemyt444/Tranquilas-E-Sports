<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Skull Blaze Admin Panel</title>

<link rel="stylesheet" href="style.css">

<style>

.admin-box{
    max-width:900px;
    margin:40px auto;
    background:#181818;
    padding:30px;
    border-radius:15px;
}

.admin-box h1{
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin:10px 0;
    background:#222;
    border:1px solid #444;
    color:white;
    border-radius:8px;
}

button{
    width:100%;
    padding:15px;
    background:#b8860b;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
    margin-top:10px;
}

button:hover{
    background:#d4a017;
}

table{
    width:100%;
    margin-top:30px;
    border-collapse:collapse;
}

th,td{
    padding:15px;
    text-align:left;
}

th{
    background:#222;
}

tr:nth-child(even){
    background:#202020;
}

.delete{
    background:#c0392b;
    padding:8px 15px;
    border:none;
    color:white;
    cursor:pointer;
    border-radius:6px;
}

.delete:hover{
    background:#e74c3c;
}

</style>

</head>

<body>

<div class="admin-box">

<h1>🏆 Skull Blaze Admin Panel</h1>

<input type="text" id="name" placeholder="Player Name">

<input type="number" id="points" placeholder="Points">

<input type="number" id="kills" placeholder="Kills">

<input type="number" id="assists" placeholder="Assists">

<input type="number" id="events" placeholder="Events">

<input type="number" id="payroll" placeholder="Payroll">

<button onclick="addPlayer()">

Add Player

</button>

<table>

<thead>

<tr>

<th>Name</th>

<th>Points</th>

<th>Delete</th>

</tr>

</thead>

<tbody id="playerTable">

</tbody>

</table>

</div>

<script src="admin.js"></script>

</body>
</html>
